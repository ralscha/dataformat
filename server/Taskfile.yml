version: '3'

vars:
  MVNW: '{{if eq OS "windows"}}cmd /c mvnw.cmd{{else}}./mvnw{{end}}'

tasks:
  default:
    cmds:
      - task --list

  compile-flatbuffers:
    desc: Generate schema classes using the compilers configured in Maven
    cmds:
      - '{{.MVNW}} generate-sources'

  build:
    desc: Build and test the application
    cmds:
      - '{{.MVNW}} verify'

  clean-build:
    desc: Clean, build and test the application
    cmds:
      - '{{.MVNW}} clean verify'

  clean:
    desc: Remove generated build output
    cmds:
      - '{{.MVNW}} clean'

  run:
    desc: Run the Spring Boot application
    cmds:
      - '{{.MVNW}} spring-boot:run'
